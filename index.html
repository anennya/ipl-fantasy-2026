<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🏏 IPL Predictor 2026</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <style>
    :root {
      --orange: #FF6B00; --orange-light: #FF8C33; --gold: #FFD700;
      --dark: #0A0A15; --dark2: #141428; --dark3: #1E1E3A;
      --border: #2A2A4A; --text: #E8E8F8; --muted: #8888AA;
      --green: #00D68F; --red: #FF4D4D; --radius: 16px; --sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--dark); color: var(--text); min-height: 100vh; margin: 0 auto; }
    #root { padding-bottom: 72px; min-height: 100vh; }
    .page-content { max-width: 600px; margin: 0 auto; }
    .page-content.wide { max-width: 1080px; }
    .two-col { display: block; }

    @media (min-width: 768px) {
      #root { padding-bottom: 0; padding-left: 80px; }
      .page-content { max-width: 700px; }
      .page-content.wide { max-width: 1080px; padding: 0 24px; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0; align-items: start; }
      .two-col > .col-left, .two-col > .col-right { min-width: 0; }
      .splash { max-width: 500px; margin: 0 auto; }
      .chat-wrap { max-height: 480px; }
    }

    /* Header */
    .hdr { background: linear-gradient(135deg, #0A0A15, #1a0a30); padding: 14px 18px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; }
    .hdr-title { font-size: 17px; font-weight: 800; }
    .hdr-badge { background: var(--orange); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 20px; letter-spacing: 0.05em; }
    .hdr-icon { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px; }

    @media (min-width: 768px) {
      .hdr { padding: 16px 24px 14px; }
      .hdr-title { font-size: 20px; }
    }

    /* Nav — bottom bar on mobile, left sidebar on desktop */
    .nav { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; background: var(--dark2); border-top: 1px solid var(--border); display: flex; z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 4px 10px; cursor: pointer; border: none; background: none; color: var(--muted); font-size: 10px; gap: 3px; transition: color 0.2s; -webkit-tap-highlight-color: rgba(255,107,0,0.2); }
    .nav-btn .ic { font-size: 21px; }
    .nav-btn.active { color: var(--orange); }
    .nav-lbl { display: inline; }

    @media (min-width: 768px) {
      .nav { bottom: auto; top: 0; left: 0; right: auto; width: 80px; height: 100vh; flex-direction: column; border-top: none; border-right: 1px solid var(--border); padding: 16px 0; justify-content: start; gap: 4px; }
      .nav-btn { flex: none; padding: 14px 8px; border-radius: 12px; margin: 0 8px; }
      .nav-btn.active { background: rgba(255,107,0,0.1); }
      .nav-lbl { display: inline; font-size: 9px; }
    }

    /* Cards */
    .card { background: var(--dark2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 12px 16px; }
    .ct { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 10px; font-weight: 700; }

    /* Match card */
    .mc { background: linear-gradient(135deg, #141428, #1a1040); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; margin: 12px 16px; text-align: center; }
    .mc-teams { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; }
    .mc-team { display: flex; flex-direction: column; align-items: center; gap: 7px; flex: 1; }
    .tbadge { width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; color: #fff; margin: 0 auto; }
    .tname { font-size: 14px; font-weight: 700; }
    .vs { font-size: 13px; color: var(--muted); font-weight: 800; padding: 0 10px; }
    .mm { display: flex; gap: 12px; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }

    @media (min-width: 768px) {
      .tbadge { width: 64px; height: 64px; font-size: 13px; }
      .tname { font-size: 16px; }
      .vs { font-size: 15px; }
    }

    /* Countdown */
    .cd { background: linear-gradient(135deg, var(--orange), #ff8c33); border-radius: var(--sm); padding: 12px 16px; text-align: center; margin: 0 16px 12px; }
    .cd-lbl { font-size: 11px; opacity: 0.85; margin-bottom: 2px; }
    .cd-time { font-size: 26px; font-weight: 900; letter-spacing: 2px; }

    /* Buttons */
    .btn { padding: 13px 22px; border-radius: var(--sm); border: none; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.1s, opacity 0.2s; display: block; width: 100%; text-align: center; }
    .btn:active { transform: scale(0.97); }
    .btn-p { background: linear-gradient(135deg, var(--orange), var(--orange-light)); color: #fff; }
    .btn-s { background: var(--dark3); color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 7px 14px; font-size: 12px; display: inline-block; width: auto; border-radius: 20px; }

    /* Form */
    .fg { margin-bottom: 14px; }
    .fl { font-size: 12px; color: var(--muted); margin-bottom: 5px; display: block; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
    .fi { width: 100%; background: var(--dark3); border: 1px solid var(--border); border-radius: var(--sm); color: var(--text); padding: 11px 13px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    .fi:focus { border-color: var(--orange); }
    select.fi { appearance: none; }

    /* Team picker */
    .tpicker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
    .toption { border: 2px solid var(--border); border-radius: var(--sm); padding: 14px 8px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--dark3); }
    .toption.sel { border-color: var(--orange); background: rgba(255,107,0,0.15); }
    .toption:active { transform: scale(0.96); }

    /* Leaderboard */
    .lbi { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .lbi:last-child { border-bottom: none; }
    .lbr { width: 28px; font-size: 15px; font-weight: 800; color: var(--muted); }
    .lbr.gold { color: var(--gold); }
    .av { width: 40px; height: 40px; border-radius: 50%; background: var(--orange); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; margin-right: 11px; color: #fff; flex-shrink: 0; }
    .lbpts { font-size: 22px; font-weight: 900; color: var(--orange); }

    /* Chat */
    .chat-wrap { max-height: 320px; overflow-y: auto; padding: 8px 0; display: flex; flex-direction: column; gap: 10px; }
    .cm { max-width: 88%; }
    .cm.user { align-self: flex-end; }
    .cm.bot { align-self: flex-start; }
    .cb { padding: 10px 13px; border-radius: 16px; font-size: 13px; line-height: 1.55; }
    .cm.user .cb { background: var(--orange); color: #fff; border-bottom-right-radius: 4px; }
    .cm.bot .cb { background: var(--dark3); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .cm.bot .cb a { color: var(--orange); text-decoration: underline; }
    .ci-row { display: flex; gap: 8px; margin-top: 10px; }
    .ci-row .fi { flex: 1; }
    .csend { background: var(--orange); border: none; border-radius: var(--sm); color: #fff; font-size: 18px; width: 46px; cursor: pointer; flex-shrink: 0; }

    /* Pitch bars */
    .ps { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .ps:last-child { border-bottom: none; }
    .pbw { flex: 1; height: 7px; background: var(--dark3); border-radius: 4px; margin: 0 10px; overflow: hidden; }
    .pb { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--orange), var(--gold)); }

    /* Splash */
    .splash { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; text-align: center; }
    .splash-logo { font-size: 60px; margin-bottom: 12px; }
    .splash-title { font-size: 26px; font-weight: 900; background: linear-gradient(135deg, var(--orange), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .splash-sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; line-height: 1.6; }

    /* Badges */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .bg-g { background: rgba(0,214,143,0.15); color: var(--green); }
    .bg-o { background: rgba(255,107,0,0.15); color: var(--orange); }
    .bg-m { background: var(--dark3); color: var(--muted); }
    .bg-r { background: rgba(255,77,77,0.15); color: var(--red); }

    /* Misc */
    .sh { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 4px; }
    .sh h2 { font-size: 17px; font-weight: 800; }
    .divider { height: 1px; background: var(--border); margin: 12px 16px; }
    .empty { text-align: center; padding: 32px; color: var(--muted); }
    .empty .ei { font-size: 40px; display: block; margin-bottom: 10px; }
    .toast { position: fixed; bottom: 82px; left: 50%; transform: translateX(-50%); background: #2A2A4A; border: 1px solid var(--border); color: var(--text); padding: 11px 20px; border-radius: 24px; font-size: 13px; font-weight: 700; z-index: 999; animation: tin 0.3s ease; white-space: nowrap; }
    @keyframes tin { from { opacity:0; transform:translateX(-50%) translateY(8px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
    .pts-row { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
    .pts-row:last-child { border-bottom: none; }
    .pts-v { color: var(--green); font-weight: 700; }
    .pts-miss { color: var(--red); font-weight: 700; }
    .admin-box { background: rgba(255,107,0,0.08); border: 1px solid rgba(255,107,0,0.25); border-radius: var(--radius); padding: 16px; margin: 12px 16px; }
    .api-box { background: rgba(255,215,0,0.05); border: 1px solid rgba(255,215,0,0.2); border-radius: var(--sm); padding: 12px; margin-bottom: 14px; }
    .mrc { background: var(--dark3); border-radius: var(--sm); padding: 12px; margin-bottom: 8px; }
    .mrc-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    a.btn { text-decoration: none; display: block; }
    .quick-btns { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }

    /* News widget */
    .news-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; text-decoration: none; color: inherit; }
    .news-item:last-child { border-bottom: none; }
    .news-item:active { opacity: 0.7; }
    .news-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); flex-shrink: 0; margin-top: 5px; }
    .news-body { flex: 1; min-width: 0; }
    .news-title { font-size: 13px; font-weight: 600; line-height: 1.45; margin-bottom: 3px; }
    .news-meta { font-size: 11px; color: var(--muted); }
    .news-loading { text-align: center; color: var(--muted); font-size: 13px; padding: 16px 0; }
    .news-refresh { font-size: 11px; color: var(--orange); background: none; border: none; cursor: pointer; float: right; font-weight: 700; }

    /* Prediction sections */
    .pred-section { background: var(--dark3); border-radius: var(--sm); padding: 14px; margin-bottom: 12px; }
    .pred-section .fl { margin-bottom: 8px; }
    .num-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    @media (min-width: 768px) {
      .num-grid { grid-template-columns: 1fr 1fr 1fr; }
      .pred-section { padding: 20px; }
    }

    /* Stats bars */
    .stat-bar { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    .stat-label { font-size: 12px; color: var(--muted); width: 90px; }
    .stat-fill { flex: 1; height: 6px; background: var(--dark3); border-radius: 3px; overflow: hidden; }
    .stat-fill-inner { height: 100%; border-radius: 3px; background: var(--orange); transition: width 0.5s; }
    .stat-val { font-size: 12px; font-weight: 700; color: var(--text); width: 30px; text-align: right; }

    /* Banner */
    .banner { background: linear-gradient(135deg, rgba(0,214,143,0.15), rgba(0,214,143,0.05)); border: 1px solid rgba(0,214,143,0.3); border-radius: var(--sm); padding: 12px 16px; margin: 12px 16px; font-size: 13px; color: var(--green); display: flex; align-items: center; gap: 10px; cursor: pointer; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
// ================================================================
// DATA
// ================================================================
const TEAMS = {

const MATCHES = [
  { id:"m1",  no:1,  date:"2026-03-28", time:"19:30", team1:"RCB",  team2:"SRH",  venue:"M. Chinnaswamy Stadium",             city:"Bengaluru" },
  { id:"m2",  no:2,  date:"2026-03-29", time:"19:30", team1:"MI",   team2:"KKR",  venue:"Wankhede Stadium",                   city:"Mumbai" },
  { id:"m3",  no:3,  date:"2026-03-30", time:"19:30", team1:"RR",   team2:"CSK",  venue:"Barsapara Cricket Stadium",          city:"Guwahati" },
  { id:"m4",  no:4,  date:"2026-03-31", time:"19:30", team1:"PBKS", team2:"GT",   venue:"Maharaja Yadavindra Singh Stadium",  city:"Mullanpur" },
  { id:"m5",  no:5,  date:"2026-04-01", time:"19:30", team1:"LSG",  team2:"DC",   venue:"Ekana Cricket Stadium",              city:"Lucknow" },
  { id:"m6",  no:6,  date:"2026-04-02", time:"19:30", team1:"KKR",  team2:"SRH",  venue:"Eden Gardens",                      city:"Kolkata" },
];

const PITCH = {
  "Bengaluru": { bat:85, bowl:60, spin:55, pace:65, dew:70,  note:"High-scoring ground with short boundaries. Dew heavily favours the chasing side at night." },
  "Mumbai":    { bat:75, bowl:70, spin:50, pace:75, dew:65,  note:"Balanced pitch. Sea breeze aids early swing. Dew factor significant in second innings." },
  "Guwahati":  { bat:60, bowl:80, spin:82, pace:52, dew:30,  note:"Spin-friendly, slow surface. Low-scoring games typical. Home comfort for wrist spinners." },
  "Mullanpur": { bat:70, bowl:72, spin:45, pace:80, dew:50,  note:"New stadium with hard pitches. Pacers extract bounce early. Pitch settles for batters later." },
  "Lucknow":   { bat:58, bowl:82, spin:88, pace:58, dew:38,  note:"One of the slowest IPL pitches. Spinners dominate. Batting gets progressively harder." },
  "Kolkata":   { bat:74, bowl:72, spin:60, pace:76, dew:65,  note:"Iconic venue. Seamers effective early morning; pitch eases later. Evening dew is significant." },
  "Chennai":   { bat:62, bowl:78, spin:90, pace:50, dew:25,  note:"MA Chidambaram is a spinner's paradise. Slow, low surface with sharp turn." },
  "Hyderabad": { bat:78, bowl:65, spin:58, pace:70, dew:55,  note:"Hard, true pitch. Fast outfield makes this a big-scoring venue." },
  "Delhi":     { bat:72, bowl:68, spin:62, pace:72, dew:58,  note:"Decent batting surface. Seamers get help early; pitch flattens. Evening dew significant." },
  "Ahmedabad": { bat:80, bowl:62, spin:48, pace:74, dew:45,  note:"Large outfield but true, fast pitch. Pacers effective early; batting gets easier." },
  "Jaipur":    { bat:65, bowl:75, spin:78, pace:60, dew:42,  note:"Slower than most IPL venues. Spinners come into play early; low scores competitive." },
  "Dharamshala":{ bat:68, bowl:74, spin:55, pace:82, dew:20, note:"High-altitude venue. Seam and swing pronounced throughout. Low dew." },
};

const SCORING = {
  winner:       { exact: 3 },
  streakBonus:  { threshold: 3, multiplier: 1.5 },
};

const CHAT_CONTEXT = {
  content:`You are an IPL 2026 cricket analyst. Follow these rules strictly:
1. ONLY state facts from the [NEWS CONTEXT] or [MATCH DATA] sections below, or well-established historical facts (team records, venue stats, player career stats).
2. When citing recent news, ALWAYS include the source name with a link in markdown format: [Source Name](url).
3. If you are not confident about a claim, say "I don't have confirmed information on that."
4. NEVER invent injury updates, team selection news, or trade rumors.
5. Do not use information older than 7 days unless discussing historical team/player statistics.
6. Keep responses under 200 words.`
};

// ================================================================
// STATE
// ================================================================
let db = null, currentUser = null, currentView = "home";
let groupId = null, groupInfo = null;
let participants = {}, predictions = {}, results = {}, chatHistory = [];
let isAdmin = false, selectedTeam = null, countdownInterval = null;

// ================================================================
// LOCAL STORAGE
// ================================================================
const LS = {
  get: k => { try { return JSON.parse(localStorage.getItem("ipl26_"+k)); } catch(e){ return null; } },
  set: (k,v) => { try { localStorage.setItem("ipl26_"+k, JSON.stringify(v)); } catch(e){} },
  del: k => localStorage.removeItem("ipl26_"+k),
};

// ================================================================
// FIREBASE
// ================================================================
function initFirebase(config) {
  try {
    if (!firebase.apps.length) firebase.initializeApp(config);
    db = firebase.database();
    return true;
  } catch(e) { console.error(e); return false; }
}

function listenToGroup(gid) {
  groupId = gid;
  LS.set("groupId", gid);
  const g = db.ref(`groups/${gid}`);
  g.child("info").on("value", s => { groupInfo = s.val()||{}; safeRender(); });
  g.child("members").on("value", s => { participants = s.val()||{}; safeRender(); });
  g.child("predictions").on("value", s => { predictions = s.val()||{}; safeRender(); });
  g.child("results").on("value", s => { results = s.val()||{}; safeRender(); });
}

function gRef(path) { return `groups/${groupId}/${path}`; }

function fbSet(path, val) {
  if (db && groupId) return db.ref(gRef(path)).set(val);
  // Demo mode fallback
  const parts = path.split("/");
  if (path.startsWith("predictions/")) {
    const [,matchId,userId] = parts;
    if (!predictions[matchId]) predictions[matchId] = {};
    predictions[matchId][userId] = val;
  } else if (path.startsWith("results/")) {
    const [,matchId] = parts;
    results[matchId] = val;
  } else if (path.startsWith("members/")) {
    const [,uid] = parts;
    participants[uid] = val;
  }
  return Promise.resolve();
}

function fbDel(path) {
  if (db && groupId) return db.ref(gRef(path)).remove();
  const parts = path.split("/");
  if (path.startsWith("predictions/")) {
    const [,matchId,userId] = parts;
    if (predictions[matchId]) delete predictions[matchId][userId];
  }
  return Promise.resolve();
}

// ================================================================
// AUTH (Google Sign-In)
// ================================================================
async function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    const btn = document.getElementById('google-signin-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Signing in...'; }
    const result = await firebase.auth().signInWithPopup(provider);
    const user = result.user;
    const uid = user.uid;
    const displayName = user.displayName || '';
    // Check if returning user in this group
    if (db && groupId && groupId !== "demo") {
      try {
        const snap = await db.ref(`groups/${groupId}/members/${uid}`).once('value');
        const existing = snap.val();
        if (existing && existing.name) {
          currentUser = { id: uid, name: existing.name };
          LS.set("user", currentUser);
          listenToGroup(groupId);
          go("home");
          return;
        }
      } catch(e) {}
    }
    // New user — use Google display name or ask for one
    if (displayName) {
      await completeGoogleLogin(uid, displayName);
    } else {
      renderNameEntry(uid);
    }
  } catch(e) {
    console.error("Google sign-in error:", e);
    const btn = document.getElementById('google-signin-btn');
    if (btn) { btn.disabled = false; btn.innerHTML = googleBtnContent(); }
    if (e.code === 'auth/popup-closed-by-user') toast("Sign-in cancelled");
    else if (e.code === 'auth/unauthorized-domain') toast("Add this domain to Firebase Authorized Domains");
    else toast("Sign-in failed. Try again.");
  }

// ================================================================

function getNextMatch() {
  const now = new Date();
  for (const m of MATCHES) {
    const dt = new Date(m.date+"T"+m.time+":00+05:30");
    if (dt > now) return m;
  }
  return MATCHES[MATCHES.length-1];
}
function getMatch(id) { return MATCHES.find(m=>m.id===id); }
function fmtDate(d) { return new Date(d+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"}); }
function fmtCD(dt) {
  const diff = dt - new Date();
  if (diff <= 0) return "LIVE NOW";
  const d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000),
        m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
  if (d>0) return `${d}d ${h}h ${m}m`;
  if (h>0) return `${h}h ${m}m ${s}s`;
  return `${m}m ${s}s`;
}
function toast(msg, dur=2800) {
  document.querySelector(".toast")?.remove();
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), dur);
}
function deadlinePast(m) { return new Date() > new Date(m.date+"T"+m.time+":00+05:30"); }

// Convert markdown links to HTML
function mdLinks(text) {
  return text.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// ================================================================
// SCORING ENGINE
// ================================================================

function getWinStreak(uid) {
  let streak = 0;
  const sortedMatches = MATCHES.filter(m => results[m.id]).sort((a,b) => a.date.localeCompare(b.date));
  for (let i = sortedMatches.length - 1; i >= 0; i--) {
    const m = sortedMatches[i];
    const pred = (predictions[m.id]||{})[uid];
    if (!pred || !results[m.id]) break;
    if (pred.winner === results[m.id].winner) streak++;
    else break;
  }
  return streak;
}

function calcPts(uid) {
  let total = 0, breakdown = [];
  for (const [mid, res] of Object.entries(results)) {
    const pred = (predictions[mid]||{})[uid]; if (!pred) continue;
    const m = getMatch(mid); if (!m) continue;
    let pts = 0, det = [];

    // Handle no_result
    if (res.status === "no_result") {
      pts = 2;
      det.push({ cat: "No Result", pts: 2, note: "Consolation" });
      total += pts;
      breakdown.push({ mid, m, pts, det });
      continue;
    }

    // Winner
    const winPts = pred.winner === res.winner ? SCORING.winner.exact : 0;
    let winLabel = winPts > 0 ? "Correct" : "Wrong";
    let finalWinPts = winPts;
    if (winPts > 0) {
      const streak = getWinStreak(uid);
      if (streak >= SCORING.streakBonus.threshold) {
        finalWinPts = Math.round(winPts * SCORING.streakBonus.multiplier);
        winLabel += ` (${streak} streak! 1.5x)`;
      }
    }
    pts += finalWinPts;
    det.push({ cat: "Winner", pts: finalWinPts, note: winLabel });

    total += pts;
    breakdown.push({ mid, m, pts, det });
  }
  return { total, breakdown };
}

function leaderboard() {
  return Object.entries(participants)
    .filter(([uid,u]) => u && typeof u === "object" && u.name)
    .map(([uid,u]) => ({ uid, name: u.name, ...calcPts(uid) }))
    .sort((a,b) => b.total - a.total);
}

  `, true));
}

function renderAdminPanel() {
  return `
    <p style="font-size:12px;color:var(--green);margin-bottom:12px">Admin access granted.</p>
    <div class="fg"><label class="fl">Select Match</label>
      <select class="fi" id="adm-m" onchange="loadAdmMatch()">
        <option value="">-- Select match --</option>
        ${MATCHES.map(m=>`<option value="${m.id}">${m.no}. ${m.team1} vs ${m.team2} (${fmtDate(m.date)})${results[m.id]?" ✅":""}</option>`).join("")}
      </select>
    </div>
    <div id="adm-form" style="display:none">
      <div class="fg"><label class="fl">Status</label>
        <select class="fi" id="adm-status">
          <option value="completed">Completed</option>
          <option value="no_result">No Result / Abandoned</option>
          <option value="dls">DLS Method</option>
          <option value="super_over">Super Over</option>
        </select>
      </div>
      <div class="fg"><label class="fl">Winner</label>
        <select class="fi" id="adm-w"><option value="">-- Pick winner --</option></select>
      </div>
      <button class="btn btn-p" onclick="saveResult()">Save Result & Update Points</button>
    </div>
  `;
}

function loadAdmMatch() {
  const mid=document.getElementById("adm-m")?.value; if(!mid)return;
  const m=getMatch(mid); if(!m)return;
  const form=document.getElementById("adm-form"); if(!form)return;
  form.style.display="block";

  const ws=document.getElementById("adm-w");
  ws.innerHTML=`<option value="">-- Pick winner --</option>
    <option value="${m.team1}" ${results[mid]?.winner===m.team1?"selected":""}>${m.team1}</option>
    <option value="${m.team2}" ${results[mid]?.winner===m.team2?"selected":""}>${m.team2}</option>`;

  if(results[mid]){
    const r = results[mid];
    const setVal = (id, val) => { const el=document.getElementById(id); if(el) el.value=val||""; };
    setVal("adm-status", r.status||"completed");
  }
}

function saveResult() {
  const mid=document.getElementById("adm-m")?.value;
  const winner=document.getElementById("adm-w")?.value;
  const status=document.getElementById("adm-status")?.value||"completed";

  if (!mid) { toast("Select a match!"); return; }
  if (status !== "no_result" && !winner) { toast("Select a winner!"); return; }

  fbSet(`results/${mid}`, { status, winner: winner||"", ts: Date.now() })
    .then(()=>{ toast("Result saved! Points updated."); renderAdmin(); });
}

// ================================================================
// CHAT / AI
// ================================================================
async function doChat() {
  const inp=document.getElementById("ci"); if(!inp)return;
  const msg=inp.value.trim(); if(!msg)return;
  inp.value=""; askQ(msg);
}

async function askQ(q) {
  chatHistory.push({role:"user",content:q});
  const nm=getNextMatch(), p=PITCH[nm.city]||{};

  chatHistory.push({role:"bot",content:"Analysing..."});
  renderHome();

  const today = new Date().toISOString().slice(0,10);
  const sysMsg = `${CHAT_CONTEXT.content}\n\nToday's date: ${today}\n\n[MATCH DATA]\nMatch: ${nm.team1} vs ${nm.team2}\nVenue: ${nm.venue}, ${nm.city}\nDate: ${nm.date}\nPitch: batting=${p.bat}/100, bowling=${p.bowl}/100, spin=${p.spin}/100, pace=${p.pace}/100, dew=${p.dew}/100\nPitch notes: ${p.note}`;

  try {
    const res = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:q, systemPrompt:sysMsg, team1:nm.team1, team2:nm.team2})
    });
    if (res.ok) {
      const d = await res.json();
      chatHistory[chatHistory.length-1] = {role:"bot", content:d.content};
    } else { throw new Error("proxy unavailable"); }
  } catch(e) {
    chatHistory[chatHistory.length-1] = {role:"bot",
      content:`Pitch insight for ${nm.city}:\n${p.note}\n\nBatting: ${p.bat}/100 · Spin: ${p.spin}/100 · Pace: ${p.pace}/100 · Dew: ${p.dew}/100\n\nFor live AI analysis, deploy to Netlify with your Claude API key.`};
  }
  renderHome();
}


// ================================================================
// NEWS
// ================================================================
function renderNewsItems(articles) {
  if (!articles || articles.length === 0) {
    return `<div class="news-loading">No news found. Try refreshing.</div>`;
  }
  return articles.map(a => `
    <a class="news-item" href="${a.link}" target="_blank" rel="noopener">
      <div class="news-dot"></div>
      <div class="news-body">
        <div class="news-title">${a.title}</div>
        <div class="news-meta">${a.source}${a.timeAgo ? " · " + a.timeAgo : ""}</div>
      </div>
    </a>`).join("");
}

async function loadNews(team1, team2) {
  const el = document.getElementById("news-widget"); if (!el) return;
  el.innerHTML = `<div class="news-loading">Loading...</div>`;
  try {
    const res = await fetch(`/api/news?teams=${encodeURIComponent(team1 + " " + team2)}`);
    const articles = res.ok ? await res.json() : [];
    el.innerHTML = renderNewsItems(articles);
  } catch(e) {
    el.innerHTML = `<div class="news-loading">Could not load news.</div>`;
  }
}

// ================================================================
// SHARING
// ================================================================
function shareApp() {
  const cfg = LS.get("fbConfig");
  if (!cfg || cfg.demo) { toast("Set up Firebase first"); return; }
  const { apiKey, databaseURL, projectId } = cfg;
  const gid = LS.get("groupId");
  if (!apiKey || !databaseURL || !projectId) { toast("Firebase config incomplete"); return; }
  const encoded = btoa(JSON.stringify({ apiKey, databaseURL, projectId, groupId: gid }));
  const url = `${location.origin}${location.pathname}?join=${encoded}`;
  navigator.clipboard?.writeText(url);
  toast("Invite link copied!");
}

function generateGroupLink() {
  const cfg = LS.get("fbConfig");
  if (!cfg || cfg.demo) { toast("Set up Firebase first"); return; }
  const { apiKey, databaseURL, projectId } = cfg;
  const gid = LS.get("groupId");
  if (!apiKey || !databaseURL || !projectId) { toast("Firebase config incomplete"); return; }
  const encoded = btoa(JSON.stringify({ apiKey, databaseURL, projectId, groupId: gid }));
  const url = `${location.origin}${location.pathname}?join=${encoded}`;
  const text = `🏏 Join our IPL 2026 predictor!\nPick winners, top scorers & more for every match — no money, just bragging rights.\n\n${url}`;
  const waUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
  if (navigator.share) navigator.share({ title: "IPL Predictor 2026", text, url });
  else window.open(waUrl, "_blank");
}

function shareResults() {
  const board = leaderboard().slice(0, 5);
  const medals = ["🥇","🥈","🥉"];
  // Find most recent result
  const recentMid = Object.keys(results).sort().pop();
  const recentMatch = recentMid ? getMatch(recentMid) : null;
  const r = recentMid ? results[recentMid] : null;

  let text = `🏏 IPL Predictor — Results!\n\n`;
  if (recentMatch && r) {
    text += `${recentMatch.team1} vs ${recentMatch.team2}\n`;
    text += `Winner: ${r.winner}\n`;
    if (r.topScorer) text += `Top Scorer: ${r.topScorer}\n`;
    if (r.mostWickets) text += `Most Wickets: ${r.mostWickets}\n\n`;
  }
  text += `📊 Leaderboard:\n`;
  board.forEach((p,i) => { text += `${i<3?medals[i]:i+1+"."}  ${p.name} — ${p.total} pts\n`; });
  const nm = getNextMatch();
  const url = `${location.origin}${location.pathname}`;
  text += `\nNext: ${nm.team1} vs ${nm.team2} (${fmtDate(nm.date)})\nPredict now: ${url}`;

  const waUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
  if (navigator.share) navigator.share({ title: "IPL Predictor Results", text });
  else window.open(waUrl, "_blank");
}

function shareReminder() {
  const nm = getNextMatch();
  const url = `${location.origin}${location.pathname}`;
  const text = `🏏 ${nm.team1} vs ${nm.team2} — ${fmtDate(nm.date)} at ${nm.time} IST\n\nDon't forget to submit your predictions!\n\n${url}`;
  const waUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
  if (navigator.share) navigator.share({ title: "IPL Predictor Reminder", text });
  else window.open(waUrl, "_blank");
}

// SETTINGS HELPERS
// ================================================================
function checkPwd() {
  const cfg = LS.get("fbConfig")||{};
  const input = document.getElementById("apwd")?.value;
  // Check against local config or Firebase groupInfo
  const adminPwd = cfg.adminPwd || groupInfo?.adminPwd;
  if (!adminPwd || input === adminPwd) { isAdmin=true; toast("Admin unlocked!"); renderAdmin(); }
  else toast("Wrong password!");
}

function renameGroup() {
  const name = document.getElementById("gname-input")?.value.trim();
  if (!name) { toast("Enter a group name"); return; }
  if (db && groupId) {
    db.ref(`groups/${groupId}/info/name`).set(name).then(() => { toast("Group renamed!"); });
  }
  const cfg = LS.get("fbConfig");
  if (cfg) { cfg.groupName = name; LS.set("fbConfig", cfg); }
}

function changeName() {
  const n = prompt("Enter new name:", currentUser.name);
  if(n&&n.trim()){
    currentUser.name=n.trim(); LS.set("user",currentUser);
    fbSet(`members/${currentUser.id}/name`, currentUser.name).then(()=>{ toast("Name updated!"); renderAdmin(); });
  }
}

function resetApp() {
  if(confirm("Reset app? You'll need to reconfigure.")) {
    try { firebase.auth().signOut(); } catch(e){}
    ["fbConfig","user","groupId","lastResultSeen"].forEach(k=>LS.del(k));
    location.reload();
  }
}

// ================================================================
// NAVIGATION & INIT
// ================================================================
function go(view) { currentView=view; renderView(); }

function renderView() {
  if (countdownInterval && currentView !== "home") { clearInterval(countdownInterval); countdownInterval=null; }
  switch(currentView) {
    case "home":     renderHome(); break;
    case "stats":    renderStats(); break;
    case "lb":       renderLeaderboard(); break;
    case "admin":    renderAdmin(); break;
  }
}

async function init() {
  // Decode group invite link: ?join=BASE64CONFIG (query param survives WhatsApp sharing)
  const params = new URLSearchParams(location.search);
  const joinParam = params.get("join");
  if (joinParam) {
    try {
      const data = JSON.parse(atob(joinParam));
      if (data.apiKey && data.databaseURL && data.projectId) {
        const cfg = {
          apiKey: data.apiKey, databaseURL: data.databaseURL, projectId: data.projectId,
          authDomain: data.projectId + ".firebaseapp.com",
          storageBucket: data.projectId + ".appspot.com",
        };
        LS.set("fbConfig", cfg);
        if (data.groupId) LS.set("groupId", data.groupId);
        history.replaceState(null, "", location.pathname);
      }
    } catch(e) {}
  }

  const cfg = LS.get("fbConfig");
  if (!cfg) { renderSetup(); return; }

  // Demo mode — simple name-only flow
  if (cfg.demo) {
    groupId = "demo";
    const u = LS.get("user");
    if (!u) { renderLogin(); return; }
    currentUser = u;
    go("home");
    return;
  }

  // Real Firebase — initialize and check auth state
  if (!initFirebase(cfg)) { renderSetup(); return; }
  const gid = LS.get("groupId");
  if (gid && gid !== "demo") groupId = gid;

  // Wait for Firebase to resolve the current auth state (fires once immediately)
  const user = await new Promise(resolve => {
    const unsub = firebase.auth().onAuthStateChanged(u => { unsub(); resolve(u); });
  });

  if (user) {
    // User has an active phone auth session
    const uid = user.uid;
    if (groupId) listenToGroup(groupId);

    // Check localStorage first
    const stored = LS.get("user");
    if (stored && stored.id === uid) {
      currentUser = stored;
      go("home");
      return;
    }
    // localStorage cleared but still authed — try Firebase member record
    if (db && groupId) {
      try {
        const snap = await db.ref(`groups/${groupId}/members/${uid}`).once('value');
        const existing = snap.val();
        if (existing && existing.name) {
          currentUser = { id: uid, name: existing.name };
          LS.set("user", currentUser);
          go("home");
          return;
        }
      } catch(e) {}
    }
    // Authed but no name record — show name entry
    renderNameEntry(uid);
  } else {
    // Not signed in — show phone login
    renderLogin();
  }
}

init();
</script>
