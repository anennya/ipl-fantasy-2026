  <style>

    .news-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; text-decoration: none; color: inherit; }
    .news-item:last-child { border-bottom: none; }

    .pred-section { background: var(--dark3); border-radius: var(--sm); padding: 14px; margin-bottom: 12px; }

    .stat-bar { display: flex; align-items: center; gap: 8px; padding: 6px 0; }

    .stat-val { font-size: 12px; font-weight: 700; color: var(--text); width: 30px; text-align: right; }

<div id="root"></div>
<script>
// ================================================================
// DATA
// ================================================================
const TEAMS = {

const MATCHES = [
  { id:"m1",  no:1,  date:"2026-03-28", time:"19:30", team1:"RCB",  team2:"SRH",  venue:"M. Chinnaswamy Stadium",             city:"Bengaluru" },
  { id:"m2",  no:2,  date:"2026-03-29", time:"19:30", team1:"MI",   team2:"KKR",  venue:"Wankhede Stadium",                   city:"Mumbai" },
  { id:"m3",  no:3,  date:"2026-03-30", time:"19:30", team1:"RR",   team2:"CSK",  venue:"Barsapara Cricket Stadium",          city:"Guwahati" },
  { id:"m4",  no:4,  date:"2026-03-31", time:"19:30", team1:"PBKS", team2:"GT",   venue:"Maharaja Yadavindra Singh Stadium",  city:"Mullanpur" },
  { id:"m5",  no:5,  date:"2026-04-01", time:"19:30", team1:"LSG",  team2:"DC",   venue:"Ekana Cricket Stadium",              city:"Lucknow" },
  { id:"m6",  no:6,  date:"2026-04-02", time:"19:30", team1:"KKR",  team2:"SRH",  venue:"Eden Gardens",                      city:"Kolkata" },
];

const PITCH = {
  "Bengaluru": { bat:85, bowl:60, spin:55, pace:65, dew:70,  note:"High-scoring ground with short boundaries. Dew heavily favours the chasing side at night." },
  "Mumbai":    { bat:75, bowl:70, spin:50, pace:75, dew:65,  note:"Balanced pitch. Sea breeze aids early swing. Dew factor significant in second innings." },
  "Guwahati":  { bat:60, bowl:80, spin:82, pace:52, dew:30,  note:"Spin-friendly, slow surface. Low-scoring games typical. Home comfort for wrist spinners." },
  "Mullanpur": { bat:70, bowl:72, spin:45, pace:80, dew:50,  note:"New stadium with hard pitches. Pacers extract bounce early. Pitch settles for batters later." },
  "Lucknow":   { bat:58, bowl:82, spin:88, pace:58, dew:38,  note:"One of the slowest IPL pitches. Spinners dominate. Batting gets progressively harder." },
  "Kolkata":   { bat:74, bowl:72, spin:60, pace:76, dew:65,  note:"Iconic venue. Seamers effective early morning; pitch eases later. Evening dew is significant." },
  "Chennai":   { bat:62, bowl:78, spin:90, pace:50, dew:25,  note:"MA Chidambaram is a spinner's paradise. Slow, low surface with sharp turn." },
  "Hyderabad": { bat:78, bowl:65, spin:58, pace:70, dew:55,  note:"Hard, true pitch. Fast outfield makes this a big-scoring venue." },
  "Delhi":     { bat:72, bowl:68, spin:62, pace:72, dew:58,  note:"Decent batting surface. Seamers get help early; pitch flattens. Evening dew significant." },
  "Ahmedabad": { bat:80, bowl:62, spin:48, pace:74, dew:45,  note:"Large outfield but true, fast pitch. Pacers effective early; batting gets easier." },
  "Jaipur":    { bat:65, bowl:75, spin:78, pace:60, dew:42,  note:"Slower than most IPL venues. Spinners come into play early; low scores competitive." },
  "Dharamshala":{ bat:68, bowl:74, spin:55, pace:82, dew:20, note:"High-altitude venue. Seam and swing pronounced throughout. Low dew." },
};

const SCORING = {
  winner:       { exact: 3 },
  topScorer:    { exact: 4 },
  bestEconomy:  { exact: 4 },
  mostWickets:  { exact: 4 },
  playingXI:    { perfect: 5, good: 3, ok: 1, thresholds: [11, 8, 5] },
  totalRuns:    { exact: 3, close: 2, near: 1, band: 10 },
  powerplay:    { exact: 3, close: 2, near: 1, band: 8 },
  sixes:        { exact: 3, close: 2, near: 1, band: 2 },
  dotBalls:     { exact: 3, close: 2, near: 1, band: 10 },
  streakBonus:  { threshold: 3, multiplier: 1.5 },
};

const CHAT_CONTEXT = {
  content:`You are an IPL 2026 cricket analyst. Follow these rules strictly:
1. ONLY state facts from the [NEWS CONTEXT] or [MATCH DATA] sections below, or well-established historical facts (team records, venue stats, player career stats).
2. When citing recent news, ALWAYS include the source name with a link in markdown format: [Source Name](url).
3. If you are not confident about a claim, say "I don't have confirmed information on that."
4. NEVER invent injury updates, team selection news, or trade rumors.
5. Do not use information older than 7 days unless discussing historical team/player statistics.
6. Keep responses under 200 words.`
};

// ================================================================
// STATE
// ================================================================
let db = null, currentUser = null, currentView = "home";
let groupId = null, groupInfo = null;
let participants = {}, predictions = {}, results = {}, chatHistory = [];
let isAdmin = false, selectedTeam = null, countdownInterval = null;

// ================================================================
// LOCAL STORAGE
// ================================================================
const LS = {
  get: k => { try { return JSON.parse(localStorage.getItem("ipl26_"+k)); } catch(e){ return null; } },
  set: (k,v) => { try { localStorage.setItem("ipl26_"+k, JSON.stringify(v)); } catch(e){} },
  del: k => localStorage.removeItem("ipl26_"+k),
};

// ================================================================
// FIREBASE
// ================================================================
function initFirebase(config) {
  try {
    if (!firebase.apps.length) firebase.initializeApp(config);
    db = firebase.database();
    return true;
  } catch(e) { console.error(e); return false; }
}

function listenToGroup(gid) {
  groupId = gid;
  LS.set("groupId", gid);
  const g = db.ref(`groups/${gid}`);
  g.child("info").on("value", s => { groupInfo = s.val()||{}; safeRender(); });
  g.child("members").on("value", s => { participants = s.val()||{}; safeRender(); });
  g.child("predictions").on("value", s => { predictions = s.val()||{}; safeRender(); });
  g.child("results").on("value", s => { results = s.val()||{}; safeRender(); });
}

function gRef(path) { return `groups/${groupId}/${path}`; }

function fbSet(path, val) {
  if (db && groupId) return db.ref(gRef(path)).set(val);
  // Demo mode fallback
  const parts = path.split("/");
  if (path.startsWith("predictions/")) {
    const [,matchId,userId] = parts;
    if (!predictions[matchId]) predictions[matchId] = {};
    predictions[matchId][userId] = val;
  } else if (path.startsWith("results/")) {
    const [,matchId] = parts;
    results[matchId] = val;
  } else if (path.startsWith("members/")) {
    const [,uid] = parts;
    participants[uid] = val;
  }
  return Promise.resolve();
}

function fbDel(path) {
  if (db && groupId) return db.ref(gRef(path)).remove();
  const parts = path.split("/");
  if (path.startsWith("predictions/")) {
    const [,matchId,userId] = parts;
    if (predictions[matchId]) delete predictions[matchId][userId];
  }
  return Promise.resolve();
}

// ================================================================
// AUTH
// ================================================================
async function ensureAuth() {
  if (!db) return null;
  try {
    const user = firebase.auth().currentUser;
    if (user) return user.uid;
    const cred = await firebase.auth().signInAnonymously();
    return cred.user.uid;
  } catch(e) { console.error("Auth failed:", e); return null; }
}

// ================================================================
// UTILITIES
// ================================================================
function getNextMatch() {
  const now = new Date();
  for (const m of MATCHES) {
    const dt = new Date(m.date+"T"+m.time+":00+05:30");
    if (dt > now) return m;
  }
  return MATCHES[MATCHES.length-1];
}
function getMatch(id) { return MATCHES.find(m=>m.id===id); }
function fmtDate(d) { return new Date(d+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"}); }
function fmtCD(dt) {
  const diff = dt - new Date();
  if (diff <= 0) return "LIVE NOW";
  const d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000),
        m=Math.floor((diff%3600000)/60000), s=Math.floor((diff%60000)/1000);
  if (d>0) return `${d}d ${h}h ${m}m`;
  if (h>0) return `${h}h ${m}m ${s}s`;
  return `${m}m ${s}s`;
}
function toast(msg, dur=2800) {
  document.querySelector(".toast")?.remove();
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), dur);
}
function deadlinePast(m) { return new Date() > new Date(m.date+"T"+m.time+":00+05:30"); }

// Convert markdown links to HTML
function mdLinks(text) {
  return text.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// ================================================================
// SCORING ENGINE
// ================================================================
function scoreNumeric(pred, actual, cfg) {
  if (pred === "" || pred === undefined || actual === "" || actual === undefined) return { pts: 0, label: "—" };
  const p = parseInt(pred), a = parseInt(actual);
  if (isNaN(p) || isNaN(a)) return { pts: 0, label: "—" };
  const diff = Math.abs(p - a);
  if (diff === 0) return { pts: cfg.exact, label: "Exact!" };
  if (diff <= cfg.band) return { pts: cfg.close, label: `Within ${cfg.band}` };
  if (diff <= cfg.band * 2) return { pts: cfg.near, label: `Within ${cfg.band*2}` };
  return { pts: 0, label: `Off by ${diff}` };
}

function scorePlayer(pred, actual) {
  if (!pred || !actual) return false;
  return pred.trim().toLowerCase() === actual.trim().toLowerCase();
}

function scorePlayingXI(predArr, actualArr) {
  if (!predArr || !actualArr || !predArr.length) return { pts: 0, correct: 0 };
  const actual = actualArr.map(p => p.trim().toLowerCase());
  const correct = predArr.filter(p => actual.includes(p.trim().toLowerCase())).length;
  const t = SCORING.playingXI.thresholds;
  if (correct >= t[0]) return { pts: SCORING.playingXI.perfect, correct };
  if (correct >= t[1]) return { pts: SCORING.playingXI.good, correct };
  if (correct >= t[2]) return { pts: SCORING.playingXI.ok, correct };
  return { pts: 0, correct };
}

function getWinStreak(uid) {
  let streak = 0;
  const sortedMatches = MATCHES.filter(m => results[m.id]).sort((a,b) => a.date.localeCompare(b.date));
  for (let i = sortedMatches.length - 1; i >= 0; i--) {
    const m = sortedMatches[i];
    const pred = (predictions[m.id]||{})[uid];
    if (!pred || !results[m.id]) break;
    if (pred.winner === results[m.id].winner) streak++;
    else break;
  }
  return streak;
}

function calcPts(uid) {
  let total = 0, breakdown = [];
  for (const [mid, res] of Object.entries(results)) {
    const pred = (predictions[mid]||{})[uid]; if (!pred) continue;
    const m = getMatch(mid); if (!m) continue;
    let pts = 0, det = [];

    // Handle no_result
    if (res.status === "no_result") {
      pts = 2;
      det.push({ cat: "No Result", pts: 2, note: "Consolation" });
      total += pts;
      breakdown.push({ mid, m, pts, det });
      continue;
    }

    // Winner
    const winPts = pred.winner === res.winner ? SCORING.winner.exact : 0;
    let winLabel = winPts > 0 ? "Correct" : "Wrong";
    // Streak bonus
    let bonusApplied = false;
    let finalWinPts = winPts;
    if (winPts > 0) {
      const streak = getWinStreak(uid);
      if (streak >= SCORING.streakBonus.threshold) {
        finalWinPts = Math.round(winPts * SCORING.streakBonus.multiplier);
        bonusApplied = true;
        winLabel += ` (${streak} streak! 1.5x)`;
      }
    }
    pts += finalWinPts;
    det.push({ cat: "Winner", pts: finalWinPts, note: winLabel });

    // Player predictions
    const playerCats = [
      { key: "topScorer", label: "Top Scorer", cfg: SCORING.topScorer },
      { key: "bestEconomy", label: "Best Economy", cfg: SCORING.bestEconomy },
      { key: "mostWickets", label: "Most Wickets", cfg: SCORING.mostWickets },
    ];
    for (const pc of playerCats) {
      const correct = scorePlayer(pred[pc.key], res[pc.key]);
      const p = correct ? pc.cfg.exact : 0;
      pts += p;
      det.push({ cat: pc.label, pts: p, note: correct ? "Correct" : (pred[pc.key] ? "Wrong" : "—") });
    }

    // Playing XI
    for (const team of ["team1", "team2"]) {
      const xi = scorePlayingXI(pred[`playingXI_${team}`], res[`playingXI_${team}`]);
      pts += xi.pts;
      det.push({ cat: `XI ${m[team]}`, pts: xi.pts, note: xi.correct > 0 ? `${xi.correct}/11 correct` : "—" });
    }

    // Numerics
    const numCats = [
      { key: "totalRuns_team1", label: `Runs ${m.team1}`, cfg: SCORING.totalRuns },
      { key: "totalRuns_team2", label: `Runs ${m.team2}`, cfg: SCORING.totalRuns },
      { key: "powerplay_team1", label: `PP ${m.team1}`, cfg: SCORING.powerplay },
      { key: "powerplay_team2", label: `PP ${m.team2}`, cfg: SCORING.powerplay },
      { key: "sixes", label: "Sixes", cfg: SCORING.sixes },
      { key: "dotBalls", label: "Dot Balls", cfg: SCORING.dotBalls },
    ];
    for (const nc of numCats) {
      const s = scoreNumeric(pred[nc.key], res[nc.key], nc.cfg);
      pts += s.pts;
      det.push({ cat: nc.label, pts: s.pts, note: s.label });
    }

    total += pts;
    breakdown.push({ mid, m, pts, det });
  }
  return { total, breakdown };
}

function leaderboard() {
  return Object.entries(participants)
    .map(([uid,u]) => ({ uid, name: u.name, ...calcPts(uid) }))
    .sort((a,b) => b.total - a.total);
}

function loadAdmMatch() {
  const mid=document.getElementById("adm-m")?.value; if(!mid)return;
  const m=getMatch(mid); if(!m)return;
  const form=document.getElementById("adm-form"); if(!form)return;
  form.style.display="block";

  // Update labels
  const setLbl = (id, txt) => { const el=document.getElementById(id); if(el) el.textContent=txt; };
  setLbl("adm-tr1-lbl", `${m.team1} Total Runs`);
  setLbl("adm-tr2-lbl", `${m.team2} Total Runs`);
  setLbl("adm-pp1-lbl", `${m.team1} Powerplay`);
  setLbl("adm-pp2-lbl", `${m.team2} Powerplay`);
  setLbl("adm-xi1-lbl", `${m.team1} Playing XI`);
  setLbl("adm-xi2-lbl", `${m.team2} Playing XI`);

  const ws=document.getElementById("adm-w");
  ws.innerHTML=`<option value="">-- Pick winner --</option>
    <option value="${m.team1}" ${results[mid]?.winner===m.team1?"selected":""}>${m.team1}</option>
    <option value="${m.team2}" ${results[mid]?.winner===m.team2?"selected":""}>${m.team2}</option>`;

  // Pre-fill if results exist
  if(results[mid]){
    const r = results[mid];
    const setVal = (id, val) => { const el=document.getElementById(id); if(el) el.value=val||""; };
    setVal("adm-status", r.status||"completed");
    setVal("adm-topScorer", r.topScorer);
    setVal("adm-bestEconomy", r.bestEconomy);
    setVal("adm-mostWickets", r.mostWickets);
    setVal("adm-tr1", r.totalRuns_team1);
    setVal("adm-tr2", r.totalRuns_team2);
    setVal("adm-pp1", r.powerplay_team1);
    setVal("adm-pp2", r.powerplay_team2);
    setVal("adm-sixes", r.sixes);
    setVal("adm-dotBalls", r.dotBalls);
    setVal("adm-xi1", (r.playingXI_team1||[]).join(", "));
    setVal("adm-xi2", (r.playingXI_team2||[]).join(", "));
  }
}

function saveResult() {
  const mid=document.getElementById("adm-m")?.value;
  const winner=document.getElementById("adm-w")?.value;
  const status=document.getElementById("adm-status")?.value||"completed";

  if (!mid) { toast("Select a match!"); return; }
  if (status !== "no_result" && !winner) { toast("Select a winner!"); return; }

  const g = id => document.getElementById(id)?.value?.trim()||"";
  const parseXI = id => {
    const v = document.getElementById(id)?.value?.trim();
    if (!v) return [];
    return v.split(",").map(s=>s.trim()).filter(Boolean);
  };

  const result = {
    status, winner: winner||"",
    topScorer: g("adm-topScorer"), bestEconomy: g("adm-bestEconomy"), mostWickets: g("adm-mostWickets"),
    totalRuns_team1: g("adm-tr1"), totalRuns_team2: g("adm-tr2"),
    powerplay_team1: g("adm-pp1"), powerplay_team2: g("adm-pp2"),
    sixes: g("adm-sixes"), dotBalls: g("adm-dotBalls"),
    playingXI_team1: parseXI("adm-xi1"), playingXI_team2: parseXI("adm-xi2"),
    ts: Date.now(),
  };

  fbSet(`results/${mid}`, result)
    .then(()=>{ toast("Result saved! Points updated."); renderAdmin(); });
}

// ================================================================
// CHAT / AI
// ================================================================
async function doChat() {
  const inp=document.getElementById("ci"); if(!inp)return;
  const msg=inp.value.trim(); if(!msg)return;
  inp.value=""; askQ(msg);
}

async function askQ(q) {
  chatHistory.push({role:"user",content:q});
  const nm=getNextMatch(), p=PITCH[nm.city]||{};
  const apiKey=LS.get("claudeKey")||"";

  if (!apiKey) {
    chatHistory.push({role:"bot",content:"Add your Claude API key in Settings to enable AI analysis."});
    renderHome(); return;
  }

  chatHistory.push({role:"bot",content:"Analysing..."});
  renderHome();

  const today = new Date().toISOString().slice(0,10);
  const sysMsg = `${CHAT_CONTEXT.content}\n\nToday's date: ${today}\n\n[MATCH DATA]\nMatch: ${nm.team1} vs ${nm.team2}\nVenue: ${nm.venue}, ${nm.city}\nDate: ${nm.date}\nPitch: batting=${p.bat}/100, bowling=${p.bowl}/100, spin=${p.spin}/100, pace=${p.pace}/100, dew=${p.dew}/100\nPitch notes: ${p.note}`;

  try {
    const res = await fetch("/api/chat", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:q, apiKey, systemPrompt:sysMsg, team1:nm.team1, team2:nm.team2})
    });
    if (res.ok) {
      const d = await res.json();
      chatHistory[chatHistory.length-1] = {role:"bot", content:d.content};
    } else { throw new Error("proxy unavailable"); }
  } catch(e) {
    chatHistory[chatHistory.length-1] = {role:"bot",
      content:`Pitch insight for ${nm.city}:\n${p.note}\n\nBatting: ${p.bat}/100 · Spin: ${p.spin}/100 · Pace: ${p.pace}/100 · Dew: ${p.dew}/100\n\nFor live AI analysis, deploy to Netlify with your Claude API key.`};
  }
  renderHome();
}

function saveKey() { const v=document.getElementById("ak-in")?.value.trim(); if(v){LS.set("claudeKey",v);toast("API key saved!");renderHome();} }
function clearKey() { LS.del("claudeKey"); renderHome(); }

function renderNewsItems(articles) {
  if (!articles || articles.length === 0) {
    return `<div class="news-loading">No news found. Try refreshing.</div>`;
  }
  return articles.map(a => `
    <a class="news-item" href="${a.link}" target="_blank" rel="noopener">
      <div class="news-dot"></div>
      <div class="news-body">
        <div class="news-title">${a.title}</div>
        <div class="news-meta">${a.source}${a.timeAgo ? " · " + a.timeAgo : ""}</div>
      </div>
    </a>`).join("");
}

async function loadNews(team1, team2) {
  const el = document.getElementById("news-widget"); if (!el) return;
  el.innerHTML = `<div class="news-loading">Loading...</div>`;
  try {
    const res = await fetch(`/api/news?teams=${encodeURIComponent(team1 + " " + team2)}`);
    const articles = res.ok ? await res.json() : [];
    el.innerHTML = renderNewsItems(articles);
  } catch(e) {
    el.innerHTML = `<div class="news-loading">Could not load news.</div>`;
  }
}

// ================================================================
// SHARING
// ================================================================
function shareApp() {
  const url = window.location.href;
  navigator.clipboard?.writeText(url);
  toast("Link copied!");
}

function generateGroupLink() {
  const cfg = LS.get("fbConfig");
  if (!cfg || cfg.demo) { toast("Set up Firebase first"); return; }
  const { apiKey, databaseURL, projectId } = cfg;
  const gid = LS.get("groupId");
  if (!apiKey || !databaseURL || !projectId) { toast("Firebase config incomplete"); return; }
  const encoded = btoa(JSON.stringify({ apiKey, databaseURL, projectId, groupId: gid }));
  const url = `${location.origin}${location.pathname}#join=${encoded}`;
  const text = `🏏 Join our IPL 2026 predictor!\nPick winners, top scorers & more for every match — no money, just bragging rights.\n\n${url}`;
  const waUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
  if (navigator.share) navigator.share({ title: "IPL Predictor 2026", text, url });
  else window.open(waUrl, "_blank");
}

function shareResults() {
  const board = leaderboard().slice(0, 5);
  const medals = ["🥇","🥈","🥉"];
  // Find most recent result
  const recentMid = Object.keys(results).sort().pop();
  const recentMatch = recentMid ? getMatch(recentMid) : null;
  const r = recentMid ? results[recentMid] : null;

  let text = `🏏 IPL Predictor — Results!\n\n`;
  if (recentMatch && r) {
    text += `${recentMatch.team1} vs ${recentMatch.team2}\n`;
    text += `Winner: ${r.winner}\n`;
    if (r.topScorer) text += `Top Scorer: ${r.topScorer}\n`;
    if (r.mostWickets) text += `Most Wickets: ${r.mostWickets}\n\n`;
  }
  text += `📊 Leaderboard:\n`;
  board.forEach((p,i) => { text += `${i<3?medals[i]:i+1+"."}  ${p.name} — ${p.total} pts\n`; });
  const nm = getNextMatch();
  const url = `${location.origin}${location.pathname}`;
  text += `\nNext: ${nm.team1} vs ${nm.team2} (${fmtDate(nm.date)})\nPredict now: ${url}`;

  const waUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
  if (navigator.share) navigator.share({ title: "IPL Predictor Results", text });
  else window.open(waUrl, "_blank");
}

function shareReminder() {
  const nm = getNextMatch();
  const url = `${location.origin}${location.pathname}`;
  const text = `🏏 ${nm.team1} vs ${nm.team2} — ${fmtDate(nm.date)} at ${nm.time} IST\n\nDon't forget to submit your predictions!\n\n${url}`;
  const waUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
  if (navigator.share) navigator.share({ title: "IPL Predictor Reminder", text });
  else window.open(waUrl, "_blank");
}

function checkPwd() {
  const cfg = LS.get("fbConfig")||{};

  // Check against local config or Firebase groupInfo
  const adminPwd = cfg.adminPwd || groupInfo?.adminPwd;
  if (!adminPwd || input === adminPwd) { isAdmin=true; toast("Admin unlocked!"); renderAdmin(); }
  else toast("Wrong password!");
}

function changeName() {
  const n = prompt("Enter new name:", currentUser.name);
  if(n&&n.trim()){
    currentUser.name=n.trim(); LS.set("user",currentUser);
    fbSet(`members/${currentUser.id}/name`, currentUser.name).then(()=>{ toast("Name updated!"); renderAdmin(); });
  }
}

function resetApp() {
  if(confirm("Reset app? You'll need to reconfigure.")) {
    ["fbConfig","user","claudeKey","groupId","lastResultSeen"].forEach(k=>LS.del(k));
    location.reload();
  }
}

// ================================================================
// NAVIGATION & INIT
// ================================================================
function go(view) { currentView=view; renderView(); }

function renderView() {
  if (countdownInterval && currentView !== "home") { clearInterval(countdownInterval); countdownInterval=null; }
  switch(currentView) {
    case "home":     renderHome(); break;
    case "predict":  renderPredict(); break;
    case "stats":    renderStats(); break;
    case "lb":       renderLeaderboard(); break;
    case "admin":    renderAdmin(); break;
  }
}

async function init() {
  // Decode group invite link: #join=BASE64CONFIG
  const hash = location.hash;
  if (hash.startsWith("#join=")) {
    try {
      const data = JSON.parse(atob(hash.slice(6)));
      if (data.apiKey && data.databaseURL && data.projectId) {
        const cfg = {
          apiKey: data.apiKey, databaseURL: data.databaseURL, projectId: data.projectId,
          authDomain: data.projectId + ".firebaseapp.com",
          storageBucket: data.projectId + ".appspot.com",
        };
        LS.set("fbConfig", cfg);
        if (data.groupId) LS.set("groupId", data.groupId);
        history.replaceState(null, "", location.pathname);
      }
    } catch(e) {}
  }

  const cfg = LS.get("fbConfig");
  if (!cfg) { renderSetup(); return; }
  if (cfg.demo) { groupId="demo"; }
  else {
    if (!initFirebase(cfg)) { renderSetup(); return; }
    await ensureAuth();
    const gid = LS.get("groupId");
    if (gid && gid !== "demo") listenToGroup(gid);
  }

  const u = LS.get("user");
  if (!u) { renderLogin(); return; }
  currentUser = u;
  go("home");
}

init();
